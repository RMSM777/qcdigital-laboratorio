<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Documento · QC Digital Laboratorio</title>
<meta name="theme-color" content="#0d1526">
<link rel="icon" href="icon-192.png">
<style>
  :root{ --marca:#0d1526; --acento:#f5851f; --lab:#00a65a; --fondo:#F2F3F5; --tarjeta:#fff; --linea:#E3E5E8; --texto:#1B1D21; --tenue:#6B7078; --suave:#F6F7F9; --ok-suave:#EAF3EB; --alerta-suave:#FBF1E0; --alerta:#B26A00; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--fondo); color:var(--texto); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; line-height:1.6; }
  .wrap{ max-width:820px; margin:0 auto; background:var(--tarjeta); min-height:100vh; }
  .top{ background:var(--marca); color:#fff; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  .top a{ color:#fff; text-decoration:none; font-size:13px; font-weight:700; }
  .top .cod{ flex:1; text-align:center; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; opacity:.85; }
  .top .dl{ background:var(--acento); padding:7px 12px; border-radius:8px; white-space:nowrap; }
  .cab{ padding:20px clamp(16px,4vw,40px) 12px; border-bottom:3px solid var(--lab); }
  .cab .ty{ font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--tenue); }
  .cab h1{ font-size:clamp(20px,3.4vw,26px); line-height:1.25; margin:4px 0 8px; }
  .cab .meta{ font-size:12px; color:var(--tenue); display:flex; gap:12px; flex-wrap:wrap; }
  .aviso{ font-size:12px; color:var(--tenue); padding:10px clamp(16px,4vw,40px) 0; }
  article{ padding:4px clamp(16px,4vw,40px) 40px; max-width:80ch; }
  article h3{ font-size:17px; margin:26px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--linea); }
  article h4{ font-size:15px; margin:18px 0 6px; }
  article h5{ font-size:14px; margin:14px 0 4px; color:var(--tenue); font-style:italic; }
  article p{ margin:0 0 10px; }
  article ul, article ol{ margin:0 0 12px; padding-left:22px; }
  article li{ margin:3px 0; }
  .nt{ background:var(--ok-suave); border-left:4px solid var(--lab); padding:9px 12px; border-radius:0 6px 6px 0; font-size:14px; }
  .nt.w{ background:var(--alerta-suave); border-left-color:var(--alerta); }
  .fx{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; text-align:center; background:var(--suave); padding:10px; border-radius:6px; }
  .dt{ overflow-x:auto; margin:6px 0 14px; border:1px solid var(--linea); border-radius:6px; }
  table{ border-collapse:collapse; width:100%; font-size:13px; }
  th{ background:var(--marca); color:#fff; text-align:left; padding:7px 9px; font-size:12px; }
  td{ padding:7px 9px; border-top:1px solid var(--linea); vertical-align:top; }
  td.k{ background:var(--suave); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html#biblioteca">‹ Biblioteca</a><span class="cod" id="cod"></span><a class="dl" id="dl" href="#" download>Descargar Word</a></div>
  <div class="cab"><div class="ty" id="ty"></div><h1 id="tit">Cargando…</h1><div class="meta" id="meta"></div></div>
  <div class="aviso">Documento controlado de QC Digital Laboratorio. Toda copia descargada o impresa es copia no controlada.</div>
  <article id="doc"></article>
</div>
<script>
const c=new URLSearchParams(location.search).get('c')||'';
Promise.all([fetch('data/documentos.json').then(r=>r.json()),fetch('data/docs_html.json').then(r=>r.json())]).then(([docs,html])=>{
  const d=docs.find(x=>x.codigo===c);
  if(!d||!html[c]){document.getElementById('tit').textContent='Documento no encontrado';return}
  document.title=d.codigo+' · '+d.titulo;
  document.getElementById('cod').textContent=d.codigo;
  document.getElementById('ty').textContent=d.tipo;
  document.getElementById('tit').textContent=d.titulo;
  document.getElementById('meta').textContent='Rev. '+d.rev+' · Cláusula/ref.: '+d.clausulas+' · '+d.estado;
  const dl=document.getElementById('dl'); dl.href='docs/'+d.codigo+'.docx'; dl.download=(d.codigo+' '+d.titulo).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').slice(0,90)+'.docx';
  document.getElementById('doc').innerHTML=html[c];
});
</script>
</body>
</html>
